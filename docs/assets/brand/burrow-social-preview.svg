<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Burrow — Play local. Bring a friend.</title>
  <defs>
    <style>
      @font-face {
        font-family: "Inter Variable";
        src: url("../../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2");
        font-style: normal;
        font-weight: 100 900;
      }
    </style>
    <linearGradient id="burrow-backdrop" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101916"/>
      <stop offset="1" stop-color="#0D1211"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#burrow-backdrop)"/>
  <rect x="34" y="34" width="1212" height="572" rx="42" stroke="#F5F2E9" stroke-opacity="0.07" stroke-width="2"/>
  <rect x="42" y="48" width="18" height="18" fill="#73C6A1" opacity="0.18"/>
  <rect x="1208" y="566" width="22" height="22" fill="#FFB45C" opacity="0.16"/>

  <image href="burrow-app-icon.png" x="62" y="64" width="512" height="512" preserveAspectRatio="xMidYMid meet"/>

  <text x="650" y="218" fill="#F8F8F8" font-family="Inter Variable, Inter, Arial, sans-serif" font-size="88" font-weight="500" letter-spacing="-4">Burrow</text>
  <text x="654" y="304" fill="#F8F8F8" font-family="Inter Variable, Inter, Arial, sans-serif" font-size="48" font-weight="620" letter-spacing="-1.5">Play local.</text>
  <text x="654" y="362" fill="#73C6A1" font-family="Inter Variable, Inter, Arial, sans-serif" font-size="48" font-weight="620" letter-spacing="-1.5">Bring a friend.</text>
  <text x="658" y="438" fill="#F5F2E9" fill-opacity="0.68" font-family="Inter, Arial, sans-serif" font-size="27">Privacy-first Minecraft launcher</text>
  <text x="658" y="486" fill="#F5F2E9" fill-opacity="0.48" font-family="Inter, Arial, sans-serif" font-size="22">Windows  •  macOS  •  Linux</text>
</svg>
