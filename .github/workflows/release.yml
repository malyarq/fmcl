name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable release tag (for example, v0.8.0)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify immutable release candidate
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
      version: ${{ steps.candidate.outputs.version }}
      commit: ${{ steps.candidate.outputs.commit }}
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for measured quality gates
        run: npx playwright install --with-deps chromium

      - name: Resolve exact tag, version, and commit
        id: candidate
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          test "$TAG" = "${TAG#v}" && { echo 'tag must start with v' >&2; exit 1; }
          git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" >/dev/null
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          TAG_COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")
          test "$TAG_COMMIT" = "$(git rev-parse HEAD)"
          VERSION=${TAG#v}
          test "$VERSION" = "$(node -p "require('./package.json').version")"
          printf 'tag=%s\nversion=%s\ncommit=%s\n' "$TAG" "$VERSION" "$TAG_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Run shared source quality contract
        run: npm run quality:check -- --profile=release-source
        env:
          CI: true

      - name: Upload source quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-source-quality-evidence
          path: quality/evidence/
          if-no-files-found: ignore

  build:
    name: Build and smoke ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout immutable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prove candidate still matches checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.verify.outputs.commit }}"
          test "$(node -p "require('./package.json').version")" = "${{ needs.verify.outputs.version }}"

      - name: Require privacy-reviewed analytics configuration
        shell: bash
        env:
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
        run: test -n "$VITE_POSTHOG_PROJECT_TOKEN"

      - name: Build release artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
        run: npm run build -- --publish never

      - name: Capture local release evidence
        shell: bash
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/release-evidence
        run: |
          mkdir -p "$EVIDENCE_ROOT"
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run --auto-servernum node scripts/package-smoke.js --release-dir release/${{ needs.verify.outputs.version }} --version ${{ needs.verify.outputs.version }} --output "$EVIDENCE_ROOT/${{ runner.os }}-package-smoke.json"
          else
            node scripts/package-smoke.js --release-dir release/${{ needs.verify.outputs.version }} --version ${{ needs.verify.outputs.version }} --output "$EVIDENCE_ROOT/${{ runner.os }}-package-smoke.json"
          fi
          node scripts/release-evidence.js --artifacts-dir release/${{ needs.verify.outputs.version }} --version ${{ needs.verify.outputs.version }} --tag ${{ needs.verify.outputs.tag }} --commit ${{ needs.verify.outputs.commit }} --output "$EVIDENCE_ROOT/${{ runner.os }}-release-evidence.json"
          cp release/${{ needs.verify.outputs.version }}/SHA256SUMS.txt release/${{ needs.verify.outputs.version }}/SHA256SUMS-${{ runner.os }}.txt

      - name: Upload platform artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-package-${{ runner.os }}
          path: |
            release/${{ needs.verify.outputs.version }}/*.dmg
            release/${{ needs.verify.outputs.version }}/*.exe
            release/${{ needs.verify.outputs.version }}/*.AppImage
            release/${{ needs.verify.outputs.version }}/latest*.yml
            release/${{ needs.verify.outputs.version }}/*.blockmap
            release/${{ needs.verify.outputs.version }}/SHA256SUMS-${{ runner.os }}.txt
          if-no-files-found: error

      - name: Upload host smoke and contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/release-evidence/
          if-no-files-found: error

  verify-evidence:
    name: Verify downloaded artifact evidence
    needs: [verify, build]
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.report.outputs.path }}
    steps:
      - name: Checkout immutable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download source quality evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-source-quality-evidence
          path: quality/evidence

      - name: Download all platform artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-package-*
          path: ${{ runner.temp }}/release-assets/${{ needs.verify.outputs.version }}
          merge-multiple: true

      - name: Download platform smoke and contract evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-evidence-*
          path: ${{ runner.temp }}/downloaded-evidence

      - name: Verify build-generated platform manifests
        shell: bash
        env:
          RELEASE_ASSETS: ${{ runner.temp }}/release-assets/${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          count=0
          for manifest in "$RELEASE_ASSETS"/SHA256SUMS-*.txt; do
            test -f "$manifest"
            (cd "$RELEASE_ASSETS" && sha256sum --check "$(basename "$manifest")")
            count=$((count + 1))
          done
          test "$count" -eq 3
          rm "$RELEASE_ASSETS"/SHA256SUMS-*.txt

      - name: Verify downloaded release artifacts
        env:
          RELEASE_ASSETS: ${{ runner.temp }}/release-assets/${{ needs.verify.outputs.version }}
          VERIFIED_EVIDENCE: ${{ runner.temp }}/verified-release-evidence
        run: |
          mkdir -p "$VERIFIED_EVIDENCE"
          xvfb-run --auto-servernum node scripts/package-smoke.js --release-dir "$RELEASE_ASSETS" --version ${{ needs.verify.outputs.version }} --output "$VERIFIED_EVIDENCE/downloaded-package-smoke.json"
          node scripts/release-evidence.js --artifacts-dir "$RELEASE_ASSETS" --version ${{ needs.verify.outputs.version }} --tag ${{ needs.verify.outputs.tag }} --commit ${{ needs.verify.outputs.commit }} --output "$VERIFIED_EVIDENCE/release-evidence.json"

      - name: Aggregate host smoke evidence
        shell: bash
        env:
          DOWNLOADED_EVIDENCE: ${{ runner.temp }}/downloaded-evidence
          VERIFIED_EVIDENCE: ${{ runner.temp }}/verified-release-evidence
        run: |
          node scripts/aggregate-platform-smoke.js --input "$DOWNLOADED_EVIDENCE" --output "$VERIFIED_EVIDENCE/platform-smoke.json"

      - name: Validate schema-bound pre-push report
        id: report
        shell: bash
        env:
          VERIFIED_EVIDENCE: ${{ runner.temp }}/verified-release-evidence
        run: |
          test -f quality/schemas/prepush-release-report.schema.json
          node scripts/prepush-release-report.js --tag ${{ needs.verify.outputs.tag }} --commit ${{ needs.verify.outputs.commit }} --version ${{ needs.verify.outputs.version }} --quality quality/evidence/quality-contract.json --release-evidence "$VERIFIED_EVIDENCE/release-evidence.json" --platform-smoke "$VERIFIED_EVIDENCE/platform-smoke.json" --output "$VERIFIED_EVIDENCE/prepush-release-report.json"
          printf 'path=%s\n' "$VERIFIED_EVIDENCE/prepush-release-report.json" >> "$GITHUB_OUTPUT"

      - name: Upload verified release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-release-evidence
          path: ${{ runner.temp }}/verified-release-evidence/

      - name: Upload only verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-release-assets
          path: ${{ runner.temp }}/release-assets/${{ needs.verify.outputs.version }}/
          if-no-files-found: error

  publish:
    name: Publish approved release
    needs: [verify, verify-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Configure required reviewers and deployment restrictions externally at:
    # Settings -> Environments -> release-publication. YAML cannot create that protection.
    environment: release-publication
    steps:
      - name: Checkout the approved immutable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.tag }}
          fetch-depth: 0

      - name: Download verified release evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verified-release-evidence
          path: release-evidence

      - name: Download verified platform artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verified-release-assets
          path: release-assets

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ needs.verify.outputs.commit }}
        shell: bash
        run: |
          test -f release-evidence/prepush-release-report.json
          test -f release-assets/SHA256SUMS.txt
          test "$COMMIT" = "$(git rev-parse HEAD)"
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          test "$COMMIT" = "$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk '{print $1}')"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && { echo 'release already exists; immutable assets cannot be overwritten' >&2; exit 1; }
          if [[ "$TAG" == *-* ]]; then
            gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "${TAG#v}" --generate-notes --prerelease --latest=false
          else
            gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "${TAG#v}" --generate-notes --latest
          fi
