name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already committed in package.json (for example, 0.10.0)'
        required: true
        type: string
      commit:
        description: 'Exact 40-character commit SHA currently at origin/main'
        required: true
        type: string

concurrency:
  group: release-v${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact release candidate
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
      version: ${{ steps.candidate.outputs.version }}
      commit: ${{ steps.candidate.outputs.commit }}
      previous_tag: ${{ steps.candidate.outputs.previous_tag }}
      previous_version: ${{ steps.candidate.outputs.previous_version }}
    steps:
      - name: Checkout requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for measured quality gates
        run: npx playwright install --with-deps chromium

      - name: Resolve exact version, tag, and commit
        id: candidate
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
          TAG="v$VERSION"
          test "$COMMIT" = "$(git rev-parse HEAD)"
          test "$COMMIT" = "$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$VERSION" = "$(node -p "require('./package.json').version")"
          test -z "$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          PREVIOUS_TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          PREVIOUS_VERSION=${PREVIOUS_TAG#v}
          printf 'tag=%s\nversion=%s\ncommit=%s\nprevious_tag=%s\nprevious_version=%s\n' "$TAG" "$VERSION" "$COMMIT" "$PREVIOUS_TAG" "$PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Run shared source quality contract
        run: npm run quality:check -- --profile=release-source
        env:
          CI: true

      - name: Upload source quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-source-quality-evidence
          path: quality/evidence/
          if-no-files-found: ignore

  build:
    name: Build and smoke ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prove candidate still matches checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.verify.outputs.commit }}"
          test "$(node -p "require('./package.json').version")" = "${{ needs.verify.outputs.version }}"

      - name: Download previous published package for upgrade smoke
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ needs.verify.outputs.previous_tag }}
          PREVIOUS_VERSION: ${{ needs.verify.outputs.previous_version }}
          PREVIOUS_DIR: ${{ runner.temp }}/previous-release
        run: |
          set -euo pipefail
          mkdir -p "$PREVIOUS_DIR"
          case "${{ runner.os }}" in
            Linux) ARTIFACT_PATTERN="*-Linux-$PREVIOUS_VERSION.AppImage" ;;
            Windows) ARTIFACT_PATTERN="*-Windows-$PREVIOUS_VERSION-Setup.exe" ;;
            macOS) ARTIFACT_PATTERN="*-Mac-$PREVIOUS_VERSION-Installer.dmg" ;;
            *) echo 'unsupported release runner' >&2; exit 1 ;;
          esac
          gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARTIFACT_PATTERN" --dir "$PREVIOUS_DIR"
          ARTIFACT_PATH="$(find "$PREVIOUS_DIR" -maxdepth 1 -type f -name "$ARTIFACT_PATTERN" -print)"
          test -n "$ARTIFACT_PATH"
          test "$(printf '%s\n' "$ARTIFACT_PATH" | wc -l | tr -d ' ')" = 1
          printf 'path=%s\n' "$ARTIFACT_PATH" >> "$GITHUB_OUTPUT"

      - name: Require privacy-reviewed analytics configuration
        shell: bash
        env:
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
        run: test -n "$VITE_POSTHOG_PROJECT_TOKEN"

      - name: Build release artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
        run: npm run build -- --publish never

      - name: Capture local release evidence
        shell: bash
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/release-evidence
          PREVIOUS_ARTIFACT: ${{ steps.previous.outputs.path }}
        run: |
          mkdir -p "$EVIDENCE_ROOT"
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run --auto-servernum node scripts/package-smoke.js --release-dir release/${{ needs.verify.outputs.version }} --version ${{ needs.verify.outputs.version }} --previous-artifact "$PREVIOUS_ARTIFACT" --previous-version ${{ needs.verify.outputs.previous_version }} --output "$EVIDENCE_ROOT/${{ runner.os }}-package-smoke.json"
          else
            node scripts/package-smoke.js --release-dir release/${{ needs.verify.outputs.version }} --version ${{ needs.verify.outputs.version }} --previous-artifact "$PREVIOUS_ARTIFACT" --previous-version ${{ needs.verify.outputs.previous_version }} --output "$EVIDENCE_ROOT/${{ runner.os }}-package-smoke.json"
          fi
          node scripts/release-evidence.js --artifacts-dir release/${{ needs.verify.outputs.version }} --version ${{ needs.verify.outputs.version }} --tag ${{ needs.verify.outputs.tag }} --commit ${{ needs.verify.outputs.commit }} --output "$EVIDENCE_ROOT/${{ runner.os }}-release-evidence.json"
          cp release/${{ needs.verify.outputs.version }}/SHA256SUMS.txt release/${{ needs.verify.outputs.version }}/SHA256SUMS-${{ runner.os }}.txt

      - name: Upload platform artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-package-${{ runner.os }}
          path: |
            release/${{ needs.verify.outputs.version }}/*.dmg
            release/${{ needs.verify.outputs.version }}/*.exe
            release/${{ needs.verify.outputs.version }}/*.AppImage
            release/${{ needs.verify.outputs.version }}/latest*.yml
            release/${{ needs.verify.outputs.version }}/*.blockmap
            release/${{ needs.verify.outputs.version }}/SHA256SUMS-${{ runner.os }}.txt
          if-no-files-found: error

      - name: Upload host smoke and contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/release-evidence/
          if-no-files-found: error

  verify-evidence:
    name: Verify downloaded artifact evidence
    needs: [verify, build]
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.report.outputs.path }}
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.commit }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download source quality evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-source-quality-evidence
          path: quality/evidence

      - name: Download all platform artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-package-*
          path: ${{ runner.temp }}/release-assets/${{ needs.verify.outputs.version }}
          merge-multiple: true

      - name: Download platform smoke and contract evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-evidence-*
          path: ${{ runner.temp }}/downloaded-evidence

      - name: Verify build-generated platform manifests
        shell: bash
        env:
          RELEASE_ASSETS: ${{ runner.temp }}/release-assets/${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          count=0
          for manifest in "$RELEASE_ASSETS"/SHA256SUMS-*.txt; do
            test -f "$manifest"
            (cd "$RELEASE_ASSETS" && sha256sum --check "$(basename "$manifest")")
            count=$((count + 1))
          done
          test "$count" -eq 3
          rm "$RELEASE_ASSETS"/SHA256SUMS-*.txt

      - name: Verify downloaded release artifacts
        env:
          RELEASE_ASSETS: ${{ runner.temp }}/release-assets/${{ needs.verify.outputs.version }}
          VERIFIED_EVIDENCE: ${{ runner.temp }}/verified-release-evidence
        run: |
          mkdir -p "$VERIFIED_EVIDENCE"
          xvfb-run --auto-servernum node scripts/package-smoke.js --release-dir "$RELEASE_ASSETS" --version ${{ needs.verify.outputs.version }} --output "$VERIFIED_EVIDENCE/downloaded-package-smoke.json"
          node scripts/release-evidence.js --artifacts-dir "$RELEASE_ASSETS" --version ${{ needs.verify.outputs.version }} --tag ${{ needs.verify.outputs.tag }} --commit ${{ needs.verify.outputs.commit }} --output "$VERIFIED_EVIDENCE/release-evidence.json"

      - name: Aggregate host smoke evidence
        shell: bash
        env:
          DOWNLOADED_EVIDENCE: ${{ runner.temp }}/downloaded-evidence
          VERIFIED_EVIDENCE: ${{ runner.temp }}/verified-release-evidence
        run: |
          node scripts/aggregate-platform-smoke.js --input "$DOWNLOADED_EVIDENCE" --output "$VERIFIED_EVIDENCE/platform-smoke.json" --require-upgrade

      - name: Validate schema-bound pre-push report
        id: report
        shell: bash
        env:
          VERIFIED_EVIDENCE: ${{ runner.temp }}/verified-release-evidence
        run: |
          test -f quality/schemas/prepush-release-report.schema.json
          node scripts/prepush-release-report.js --tag ${{ needs.verify.outputs.tag }} --commit ${{ needs.verify.outputs.commit }} --version ${{ needs.verify.outputs.version }} --quality quality/evidence/quality-contract.json --release-evidence "$VERIFIED_EVIDENCE/release-evidence.json" --platform-smoke "$VERIFIED_EVIDENCE/platform-smoke.json" --output "$VERIFIED_EVIDENCE/prepush-release-report.json"
          printf 'path=%s\n' "$VERIFIED_EVIDENCE/prepush-release-report.json" >> "$GITHUB_OUTPUT"

      - name: Upload verified release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-release-evidence
          path: ${{ runner.temp }}/verified-release-evidence/

      - name: Upload only verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-release-assets
          path: ${{ runner.temp }}/release-assets/${{ needs.verify.outputs.version }}/
          if-no-files-found: error

  publish:
    name: Publish approved release
    needs: [verify, verify-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Configure required reviewers and deployment restrictions externally at:
    # Settings -> Environments -> release-publication. YAML cannot create that protection.
    environment: release-publication
    steps:
      - name: Checkout the approved candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0

      - name: Download verified release evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verified-release-evidence
          path: release-evidence

      - name: Download verified platform artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verified-release-assets
          path: release-assets

      - name: Create immutable tag and publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ needs.verify.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          test -f release-evidence/prepush-release-report.json
          test -f release-assets/SHA256SUMS.txt
          test "$COMMIT" = "$(git rev-parse HEAD)"
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          test "$COMMIT" = "$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -z "$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && { echo 'release already exists; immutable assets cannot be overwritten' >&2; exit 1; }
          node scripts/changelog-release-notes.js --current "${TAG#v}" --output release-notes.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          TAG_PUSHED=false
          cleanup_unpublished_tag() {
            test "$TAG_PUSHED" = true || return 0
            RELEASE_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)
            if [ "$RELEASE_DRAFT" = false ]; then
              echo 'release is already published; immutable tag is preserved' >&2
              return 0
            fi
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
            git push origin ":refs/tags/$TAG" || true
          }
          trap cleanup_unpublished_tag ERR
          git tag -a "$TAG" "$COMMIT" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
          TAG_PUSHED=true
          if [[ "$TAG" == *-* ]]; then
            gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "${TAG#v}" --notes-file release-notes.md --draft --prerelease
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "${TAG#v}" --notes-file release-notes.md --draft
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
            git tag -f latest "$COMMIT"
            git push --force origin refs/tags/latest
          fi
          trap - ERR
